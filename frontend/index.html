<!doctype html>
<html lang="">
    <head>
        <script>
            window.__BASE_PATH__ = '';
            window.__assetUrl = function (file) {
                return window.__BASE_PATH__ + '/' + file;
            };
        </script>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" content="#2a2a2a" />
        <script>
            // Paint the last theme's page background straight away so a light theme does not flash dark on reload.
            try {
                var bg = localStorage.getItem('iplayarr.theme.bg');
                if (bg) document.documentElement.style.backgroundColor = bg;
            } catch (e) {
                // No storage: the bundle applies the theme as soon as it loads.
            }
        </script>
        <link rel="icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" href="/iplayarr.png" />
        <title>iPlayarr Turbo</title>
    </head>
    <body>
        <noscript>
            <strong>We're sorry but iPlayarr Turbo doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </noscript>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
