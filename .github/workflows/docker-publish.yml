# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    push_to_registry:
        name: Push Docker image to GHCR
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
            attestations: write
            id-token: write

        steps:
            - name: Check out the repo
              uses: actions/checkout@v5

            - name: Extract Git tag
              id: extract_tag
              run: |
                  # Releases use their tag; a manual run (workflow_dispatch) has no tag, so use branch-sha.
                  if [ "${{ github.event_name }}" = "release" ]; then
                      echo "git_tag=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
                  else
                      echo "git_tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> $GITHUB_ENV
                  fi

            - name: Write version to JSON
              run: |
                  echo "{\"version\": \"${{ env.git_tag }}\"}" > src/config/version.json

            - name: Compute lowercase owner
              id: owner
              run: |
                  # GHCR requires a lowercase image path
                  echo "lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

            - name: Compute image tags
              id: tags
              run: |
                  # :latest only ever moves for a release built off main - a release cut from
                  # any other branch (e.g. a "dev" prerelease for testing) must never overwrite
                  # the production :latest image that docker run/compose examples pull by default.
                  TAGS="ghcr.io/${{ steps.owner.outputs.lc }}/iplayarr-turbo:${{ env.git_tag }}"
                  if [ "${{ github.event.release.target_commitish }}" = "main" ]; then
                      TAGS="$TAGS"$'\n'"ghcr.io/${{ steps.owner.outputs.lc }}/iplayarr-turbo:latest"
                  fi
                  # :dev-latest tracks the newest build from the dev branch (a prerelease targeting
                  # dev, or a manual run of this workflow on dev).
                  if [ "${{ github.event.release.target_commitish }}" = "dev" ] || [ "${{ github.event_name }}-${{ github.ref_name }}" = "workflow_dispatch-dev" ]; then
                      TAGS="$TAGS"$'\n'"ghcr.io/${{ steps.owner.outputs.lc }}/iplayarr-turbo:dev-latest"
                  fi
                  {
                      echo "list<<EOF"
                      echo "$TAGS"
                      echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Log in to GHCR
              uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.tags.outputs.list }}

            - name: Generate artifact attestation
              uses: actions/attest-build-provenance@v2
              with:
                  subject-name: ghcr.io/${{ steps.owner.outputs.lc }}/iplayarr-turbo
                  subject-digest: ${{ steps.push.outputs.digest }}
                  push-to-registry: true
