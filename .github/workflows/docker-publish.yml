# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    push_to_registry:
        name: Push Docker image to GHCR
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
            attestations: write
            id-token: write

        steps:
            - name: Check out the repo
              uses: actions/checkout@v4

            - name: Extract Git tag
              id: extract_tag
              run: echo "git_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

            - name: Write version to JSON
              run: |
                  echo "{\"version\": \"${{ env.git_tag }}\"}" > src/config/version.json

            - name: Compute lowercase owner
              id: owner
              run: |
                  # GHCR requires a lowercase image path
                  echo "lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

            - name: Log in to GHCR
              uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64,linux/arm/v7
                  tags: |
                      ghcr.io/${{ steps.owner.outputs.lc }}/iplayarr-turbo:${{ env.git_tag }}
                      ghcr.io/${{ steps.owner.outputs.lc }}/iplayarr-turbo:latest

            - name: Generate artifact attestation
              uses: actions/attest-build-provenance@v2
              with:
                  subject-name: ghcr.io/${{ steps.owner.outputs.lc }}/iplayarr-turbo
                  subject-digest: ${{ steps.push.outputs.digest }}
                  push-to-registry: true
