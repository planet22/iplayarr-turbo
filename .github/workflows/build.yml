name: PR Build Check

on:
    pull_request:
        branches:
            - '**'

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install Dependencies
              run: npm run install:both

            - name: Run build
              run: npm run build:both
